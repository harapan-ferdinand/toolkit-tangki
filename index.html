<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolkit Tangki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="menu" id="menu" aria-label="Buka navigasi">☰</button>
  <a class="brand" href="#beranda"><span class="mark" aria-hidden="true"></span><span>Toolkit Tangki</span></a>
  <span class="tank-tag" id="tank-tag"></span>
  <nav class="top-nav">
    <a class="top-link" href="#beranda">Klasifikasi</a>
    <a class="top-link" href="#tangki">Data Tangki</a>
    <a class="top-link" href="#ringkasan">Ringkasan</a>
  </nav>
  <div class="top-act">
    <button class="btn ghost sm" id="btn-import">Buka proyek</button>
    <button class="btn sm" id="btn-export">Simpan proyek</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>
<div class="layout">
  <aside class="side" aria-label="Navigasi modul">
    <nav class="side-links"><a class="top-link" href="#beranda">Klasifikasi</a><a class="top-link" href="#tangki">Data Tangki</a><a class="top-link" href="#ringkasan">Ringkasan</a><button class="btn ghost sm" type="button" onclick="document.getElementById('file').click()">Buka proyek</button></nav>
    <label class="search"><span class="sr">Cari modul atau parameter</span><input id="q" type="search" placeholder="Cari: plumbness, annular, 4.4.5…"></label>
    <div id="nav"></div>
    <p class="side-foot">Referensi: API Std 653 5th Ed. (2014), API Std 650 (2020). Hasil bersifat alat bantu engineering; keputusan akhir tetap oleh inspector / engineer berwenang.</p>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
